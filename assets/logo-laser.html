<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:310px; height:64px; overflow:hidden; background:transparent; }
  .logo { width:310px; height:64px; display:flex; align-items:center; }
  .ic { width:52px; height:52px; border-radius:12px; overflow:hidden; position:relative; flex:0 0 auto; }
  .ic img { width:100%; height:100%; object-fit:cover; object-position:46% 50%; }
  .ic .vig { position:absolute; inset:0; border-radius:12px; box-shadow: inset 0 0 28px 4px rgba(0,0,0,0.5); }
  .txt { margin-left:13px; font-family:'Segoe UI', Arial, sans-serif; font-size:37px; font-weight:800; letter-spacing:-1px; line-height:1; }
  .txt .s { color:#37474F; }
  .txt .n { color:#2E7D32; }
</style></head><body>
  <div class="logo">
    <div class="ic"><img src="jarmoluk-laser-2819141.jpg" alt=""><div class="vig"></div></div>
    <div class="txt"><span class="s">Sheet</span><span class="n">Nest</span></div>
  </div>
</body></html>
