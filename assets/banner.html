<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 420px; overflow: hidden; }
  .banner { width: 1200px; height: 420px; position: relative; overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif; }
  .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .overlay { position: absolute; inset: 0;
             background: linear-gradient(90deg, rgba(8,12,20,0.88) 0%, rgba(8,12,20,0.55) 45%, rgba(8,12,20,0.12) 80%); }
  .content { position: absolute; left: 70px; top: 50%; transform: translateY(-50%); }
  .title { font-size: 104px; font-weight: 800; letter-spacing: -3px; line-height: 1;
           color: #ffffff; text-shadow: 0 3px 24px rgba(0,0,0,0.7); }
  .title .nest { color: #5fd06f; }
  .tag { margin-top: 12px; font-size: 23px; font-weight: 600; letter-spacing: 7px;
         color: #cdd8df; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  .sub { margin-top: 20px; font-size: 18px; line-height: 1.5; color: #aebcc4; max-width: 560px;
         text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
</style>
</head>
<body>
  <div class="banner">
    <img src="jarmoluk-laser-2819141.jpg" alt="">
    <div class="overlay"></div>
    <div class="content">
      <div class="title">Sheet<span class="nest">Nest</span></div>
      <div class="tag">Nesting for sheet metal</div>
      <div class="sub">Open-source nesting for laser &amp; plasma cutting &mdash; a fork of DeepNest with a GPU raster engine.</div>
    </div>
  </div>
</body>
</html>
