<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:256px; height:256px; overflow:hidden; background:transparent; }
  .icon { width:256px; height:256px; border-radius:48px; overflow:hidden; position:relative; }
  .icon img { width:100%; height:100%; object-fit:cover; object-position:46% 50%; }
  .icon .vig { position:absolute; inset:0; border-radius:48px;
               box-shadow: inset 0 0 70px 12px rgba(0,0,0,0.55); }
  .icon .ring { position:absolute; inset:0; border-radius:48px; border:2px solid rgba(255,255,255,0.10); }
</style></head><body>
  <div class="icon">
    <img src="jarmoluk-laser-2819141.jpg" alt="">
    <div class="vig"></div>
    <div class="ring"></div>
  </div>
</body></html>
